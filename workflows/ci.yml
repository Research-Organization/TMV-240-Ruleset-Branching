name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Cancel a superseded run when a new commit is pushed to the same branch/PR — an
# iterative push style otherwise leaves 2–3 full CI runs racing to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PR-authored code runs on the persistent runner; the default job token needs only to
# read the checkout. Jobs that need more (coverage upload) widen it themselves.
permissions:
  contents: read

# ALL GITHUB-HOSTED. Every CI job runs on ubuntu-latest, in parallel, with no
# self-hosted runner in the loop — so there is no single-runner queue and no
# persistent internal-network host executing PR code. The full suite needs no
# live database (the no-live-DB guard in tests/conftest.py means no test opens a
# real connection to either database — mocked or explicitly skipped), and the
# integration layer runs against the ephemeral MySQL + Postgres service
# containers hosted runners provide natively.
#
# The fork-PR guard is retained deliberately: `uv sync` / `pytest` / `npm ci` all
# run the PR's own files (conftest.py, postinstall scripts, lockfiles), so fork
# PRs skip these jobs entirely (#356). Same-repo branches require write access.
# Keeping the guard on every job holds one rule for fork PRs across the workflow.
jobs:
  test:
    # The full suite (the longest per-run consumer). Runs on a GitHub-hosted
    # runner against ephemeral service containers — no self-hosted runner, no live
    # database, no internal-network dependency.
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Ephemeral engines for the integration layer (#476). Same images and the same
    # loopback-bound dynamic ports Tier B uses — a fixed port would collide with a
    # concurrent tier-b job, and the harness reads the assigned one anyway. MYSQL_DATABASE
    # is required, not decorative: MOVE_IT_MYSQL_DSN points at it to bootstrap each worker's
    # own database, and a connection naming no database is refused by the destination guard.
    # Both data directories sit on tmpfs (--tmpfs in options): the images declare a VOLUME
    # there, and without it every run leaves one anonymous docker volume behind on a
    # persistent runner. In-memory I/O is the bonus. Verified 2026-09-07 against the
    # integration and Tier B suites on the same images.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: move-ci-mysql-root-only
          MYSQL_DATABASE: move_replica_test_seed
        ports:
          - 127.0.0.1::3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmove-ci-mysql-root-only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: move_test_admin
          POSTGRES_PASSWORD: move-ci-postgres-only
          POSTGRES_DB: move_db_test
        ports:
          - 127.0.0.1::5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U move_test_admin -d move_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Match Aurora MySQL runtime settings
        # Production is Aurora MySQL with an EMPTY sql_mode. A stock mysql:8.0 is strict, so
        # the committed replica seed — written against production's schema, where several
        # NOT NULL columns have no default — fails to insert with "Field 'UpdatedAt' doesn't
        # have a default value". This is parity with production, not a workaround for the
        # seed. Tier B does the same and asserts it.
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          uv run python - <<'PY'
          import os

          import pymysql

          with pymysql.connect(
              host="127.0.0.1",
              port=int(os.environ["MYSQL_PORT"]),
              user="root",
              password="move-ci-mysql-root-only",
              autocommit=True,
          ) as connection, connection.cursor() as cursor:
              cursor.execute("SET GLOBAL sql_mode = ''")
              cursor.execute("SELECT @@GLOBAL.sql_mode, @@GLOBAL.lower_case_table_names")
              assert cursor.fetchone() == ("", 0)
          PY

      - name: Compose integration DSNs
        # Deliberately NOT MOVE_TEST_*_DSN: those belong to Tier B, and
        # tests/redteam/conftest.py skips tier-b tests only while both are absent. Setting
        # them here would run tier-b in this job, where its sql_mode parity assertion calls
        # pytest.exit and would abort the whole session.
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          echo "MOVE_IT_MYSQL_DSN=mysql://root:move-ci-mysql-root-only@127.0.0.1:${MYSQL_PORT}/move_replica_test_seed" >> "$GITHUB_ENV"
          echo "MOVE_IT_PG_DSN=postgresql://move_test_admin:move-ci-postgres-only@127.0.0.1:${PG_PORT}/move_db_test" >> "$GITHUB_ENV"

      - name: Tests
        # -n auto spreads the suite across the runner's cores; loadscope keeps a
        # module's tests on one worker so the live-DB tests (module-scoped
        # sentinels) don't collide across workers.
        # `not tier_b` is explicit rather than incidental: tier-b has its own job with its
        # own engines and Aurora-parity step.
        run: >-
          uv run pytest -n auto --dist loadscope -m "not tier_b"
          --cov --cov-report=xml:coverage.xml

      - name: The suite's env pins hold against a hostile environment
        # A developer .env can open auth or turn the SPA off; conftest pins both. With nothing
        # set a real pin and a setdefault look the same, so run with the WRONG values: only a
        # genuine pin passes (tests/test_env_pins.py).
        env:
          MOVE_DEV_OPEN: "1"
          MOVE_SERVE_DASHBOARD: "0"
        run: uv run pytest tests/test_env_pins.py -q

      - name: The revived integration tests must have RUN
        # pytest counts a skip as success, so a green suite above does not prove these ran.
        # Non-distributed on purpose: under -n auto each worker only sees its own subset, so
        # only an undistributed pass can check the total.
        run: uv run pytest -m "integration or integration_replica" -q

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-python
          path: coverage.xml

  upload-coverage-python:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: coverage-report-python

      # fail-on-error: the upload itself still has to work — what must NOT fail the build is
      # waiting on GitHub's coverage PROCESSING queue afterwards. Observed on #501: "Coverage
      # report uploaded successfully", then six polls of `status: pending` and a timeout at the
      # action's 160s default, turning a delivered report into a red check on a green PR. That
      # is a gate on a third-party queue's latency, not on this repository's code, and a check
      # that fails when nothing is wrong is one people learn to click past (the #490 lesson).
      # Coverage is reporting, not a correctness gate; `test` is the gate.
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage-agent
          fail-on-error: false

  tier-b:
    # GitHub-hosted: the ephemeral MySQL + Postgres below are service containers,
    # which hosted runners provide natively — nothing here touches an internal
    # database, so occupying the single self-hosted runner only made every other
    # job wait behind it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # The job runs directly on the runner, NOT inside a job container: under
    # `container: ubuntu:24.04` every Node-based download — actions/checkout's REST
    # archive fetch, setup-uv's installer — died with undici "Connect Timeout Error",
    # while the same operations on the host succeed. The DB services are published on
    # loopback-bound, dynamically assigned host ports; the Tier B fixtures accept
    # loopback hosts exactly as they do for local runs. The dynamic ports are kept on
    # hosted runners too: a fixed port is no safer and the fixtures already read the
    # assigned one.
    # Both data directories sit on tmpfs (--tmpfs in options): the images declare a VOLUME
    # there, and without it every run leaves one anonymous docker volume behind on a
    # persistent runner. In-memory I/O is the bonus. Verified 2026-09-07 against the
    # integration and Tier B suites on the same images.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: move-ci-mysql-root-only
          # The database MOVE_TEST_MYSQL_DSN names must EXIST: the admin connection selects
          # it to create each worker's own database, and a connection naming no database has
          # an unresolvable destination, which the driver guard refuses.
          MYSQL_DATABASE: move_replica_test_ci
        ports:
          - 127.0.0.1::3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmove-ci-mysql-root-only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: move_test_admin
          POSTGRES_PASSWORD: move-ci-postgres-only
          POSTGRES_DB: move_db_test
        ports:
          - 127.0.0.1::5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U move_test_admin -d move_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Fail closed in THIS job: with the flag set, missing/invalid DSNs abort the
      # run instead of skipping, so the dedicated job can't silently lose coverage.
      # Everywhere else (full-suite job, local runs) an entirely unset pair of DSNs
      # skips Tier B cleanly.
      MOVE_TIER_B_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # The services publish on dynamic loopback ports (no collisions with real
      # services on the persistent runner, or with a concurrent tier-b job), so
      # the DSNs are composed at run time rather than declared statically.
      - name: Compose Tier B DSNs
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          echo "MOVE_TEST_MYSQL_DSN=mysql://root:move-ci-mysql-root-only@localhost:${MYSQL_PORT}/move_replica_test_ci" >> "$GITHUB_ENV"
          echo "MOVE_TEST_PG_DSN=postgresql://move_test_admin:move-ci-postgres-only@localhost:${PG_PORT}/move_db_test" >> "$GITHUB_ENV"

      # GitHub Actions service syntax cannot pass an image CMD. Make the required
      # production setting effective before pytest and fail if either parity value
      # differs; the fixture independently re-checks both values before provisioning.
      - name: Match Aurora MySQL runtime settings
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          uv run python - <<'PY'
          import os

          import pymysql

          with pymysql.connect(
              host="127.0.0.1",
              port=int(os.environ["MYSQL_PORT"]),
              user="root",
              password="move-ci-mysql-root-only",
              autocommit=True,
          ) as connection, connection.cursor() as cursor:
              cursor.execute("SET GLOBAL sql_mode = ''")
              cursor.execute(
                  "SELECT @@GLOBAL.sql_mode, @@GLOBAL.lower_case_table_names"
              )
              assert cursor.fetchone() == ("", 0)
          PY

      - name: Tier B tests
        # No exit-5 allowance: the Tier B tests exist now, so "zero tests collected"
        # (a renamed marker, a collection error) is a coverage-loss failure, not a
        # pass. pytest's own exit code is the result.
        run: uv run pytest tests/redteam -n auto --dist loadscope -m tier_b

      - name: Tier B negative controls are RED
        # The provisioned databases are the only environment where the tier_b-marked
        # controls can run, so the anti-tautology gate for them lives here. The gate
        # fails if any control passes, errors, or if none are collected.
        run: |
          set +e
          # The tests/redteam path is required, not optional: it makes pytest load that
          # conftest at startup so --run-negative-controls is a registered option.
          uv run pytest tests/redteam --run-negative-controls -m tier_b --junit-xml=controls-tier-b.xml
          set -e
          uv run python scripts/check_controls_red.py controls-tier-b.xml

  negative-controls:
    # The anti-tautology gate: every negative control is a deliberately vulnerable
    # subject fed to the same oracle its paired test uses, so it MUST fail. This job
    # runs the controls (which ordinary jobs never collect) and fails the build if any
    # control passes, errors, or if the selection is empty. Tier A controls run here;
    # the tier_b-marked controls skip (no DBs) and are gated inside the tier-b job.
    #
    # GitHub-hosted: Tier A controls are pure pytest with no database and no internal
    # network, so this job never needed the self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Negative controls are RED
        run: |
          set +e
          uv run pytest tests/redteam --run-negative-controls -n auto --dist loadscope \
            --junit-xml=controls.xml
          set -e
          uv run python scripts/check_controls_red.py controls.xml

  dashboard:
    # GitHub-hosted: npm ci / eslint / vitest / tsc+vite — pure Node, no database, no
    # internal network. It was also the LONGEST job on the shared runner (5m26s
    # measured), so it delayed everything queued behind it for nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # This was previously omitted: the dashboard built and linted in CI while its
      # jsdom/Vitest suite never ran, leaving renderer regressions undetected.
      - name: Vitest
        run: npm test

      - name: Build (tsc + vite)
        run: npm run build

  dashboard-node-current:
    # The dashboard's Vitest suite on the CURRENT Node release, beside the Node 22 job above.
    # Node 25+ ships a native Web Storage global that shadowed jsdom's and broke every
    # localStorage read under test; dashboard/src/test-setup.ts restores jsdom's, and only a
    # current-Node run can prove it still does (on Node 22 the setup is a no-op).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: current
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm test
