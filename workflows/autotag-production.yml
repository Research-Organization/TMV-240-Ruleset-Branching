name: AutoTagProduction

on:
  push:
    branches:
      - production

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create production tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch --tags --force origin

          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"

          if [ -z "${LATEST_TAG}" ]; then
            VERSION="v0.1.0"
          else
            VERSION="$(LATEST_TAG="${LATEST_TAG}" python3 - <<'PY'
          import os

          major, minor, patch = map(int, os.environ["LATEST_TAG"][1:].split("."))
          print(f"v{major}.{minor}.{patch + 1}")
          PY
            )"
          fi

          echo "Creating semantic version tag: ${VERSION}"
          git tag -a "${VERSION}" "${GITHUB_SHA}" -m "Production release ${VERSION}"
          git push origin "${VERSION}"
