name: Scheduled full-history secret scan

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-full-history:
    # Scheduled/manual only: findings are loud failures but never block a pull request.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify sensitive documentation is in scan scope
        run: |
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git ls-files --error-unmatch CLAUDE.md
          test -n "$(git ls-files source-docs/)"

      - name: Install pinned gitleaks 8.24.3
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan every commit and ref
        run: |
          /tmp/gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            --verbose

      - name: Upload redacted scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-full-history-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14
