name: AutoMergeStaging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge release branch to staging
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          RELEASE_BRANCH="develop"
          git fetch --tags origin "${RELEASE_BRANCH}" staging main
          git checkout -B staging origin/staging

          BEFORE_SHA="$(git rev-parse HEAD)"
          MERGED=false

          if git merge-base --is-ancestor "origin/${RELEASE_BRANCH}" HEAD; then
            echo "staging already contains ${RELEASE_BRANCH}"
          else
            git merge --no-ff --no-edit "origin/${RELEASE_BRANCH}"
            MERGED=true
          fi

          AFTER_SHA="$(git rev-parse HEAD)"

          if [ "${MERGED}" = "true" ]; then
            echo "===================================="
            echo "PUSH STAGING"
            echo "===================================="
            git push origin HEAD:staging
          fi

          echo "===================================="
          echo "DONE"
          echo "===================================="
          echo "Before SHA: ${BEFORE_SHA}"
          echo "After SHA : ${AFTER_SHA}"
          echo "Merged    : ${MERGED}"

      - name: Publish staging to main pull request link
        run: |
          set -euo pipefail

          git fetch origin staging main

          AHEAD_COUNT="$(git rev-list --count origin/main..origin/staging)"
          if [ "${AHEAD_COUNT}" -eq 0 ]; then
            echo "staging has no changes ahead of main; no pull request needed"
            exit 0
          fi

          echo "staging has ${AHEAD_COUNT} commit(s) ahead of main."
          echo "Create the promotion pull request manually:"
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...staging?expand=1"
